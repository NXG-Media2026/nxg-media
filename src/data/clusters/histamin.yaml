  Histamin ist ein koerpereigener Botenstoff, der Immunreaktionen, Verdauung
  und Schlaf-Wach-Rhythmus steuert. Bei vielen Frauen verstaerken sich
  Histamin-Symptome im Zyklus, in der Perimenopause oder bei chronischem
  Stress — weil Oestrogen, Cortisol und der Histamin-Abbau eng zusammenhaengen.

