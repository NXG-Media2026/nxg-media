# === HUB-LEVEL CURATED FAQ ===
hubFaq:
  - question: "Was ist eine Histaminintoleranz?"
    answer: "Eine Histaminintoleranz beschreibt eine eingeschraenkte Faehigkeit, Histamin im Koerper abzubauen. Die Symptome reichen von Hautroetungen ueber Verdauungsbeschwerden bis zu Kopfschmerzen."
  - question: "Warum veraendern sich Histamin-Symptome im weiblichen Zyklus?"
    answer: "Oestrogen kann die Aktivitaet des Enzyms DAO senken, das Histamin im Darm abbaut. Bei vielen Frauen verstaerken sich Histamin-Symptome deshalb in der zweiten Zyklushaelfte oder in hormonellen Uebergangsphasen."

