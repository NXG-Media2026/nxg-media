hubFaq:
  - question:
      nl: "Voor wie is de Coach Accelerator?"
      en: "Who is the Coach Accelerator for?"
    answer:
      nl: "De Coach Accelerator is voor coaches, specialisten en kennisondernemers die al expertise of een aanbod hebben, maar nog geen online systeem dat voorspelbaar leads, kopers of klanten oplevert."
      en: "The Coach Accelerator is for coaches, specialists and knowledge experts who already have expertise or an offer, but not yet an online system that predictably creates leads, buyers or clients."
  - question:
      nl: "Is dit alleen marketing of ook strategie?"
      en: "Is this only marketing or also strategy?"
    answer:
      nl: "Dit traject combineert strategie en uitvoering: positionering, storytelling, aanbodstructuur, mini-producten, masterclasses, emailflows, ads en meetbaarheid worden als één systeem gebouwd."
      en: "This engagement combines strategy and execution: positioning, storytelling, offer architecture, mini-products, masterclasses, email flows, ads and measurement are built as one system."
  - question:
      nl: "Moet ik zelf ook input leveren?"
      en: "Do I need to provide input myself?"
    answer:
      nl: "Ja. Jij brengt de expertise, verhalen, klantinzichten en inhoud. Joost bouwt daar de structuur, copy, pagina's, emails en advertenties omheen."
      en: "Yes. You bring the expertise, stories, client insights and substance. Joost builds the structure, copy, pages, emails and ads around that."
