citableDefinition:
  nl: >
    De Coach Accelerator is een compleet groeisysteem voor coaches
    en experts — van positionering en mini-producten tot emailflows
    en ads. Alles werkt samen als één machine die expertise omzet
    in voorspelbare leads, kopers en klanten.
  en: >
    The Coach Accelerator is a complete growth system for coaches
    and experts — from positioning and micro-products to email flows
    and ads. Everything works together as one machine that turns
    expertise into predictable leads, buyers and clients.
  es: >
    El Coach Accelerator es un sistema de crecimiento completo para
    coaches y expertos — desde posicionamiento y mini-productos hasta
    emails automatizados y publicidad. Todo funciona como una sola
    máquina que convierte experiencia en leads, compradores y clientes
    de forma predecible.
hubIntro:
  nl: >
    De meeste coaches hebben de expertise al. Wat ontbreekt is een
    systeem dat die expertise omzet in voorspelbare klantgesprekken,
    productverkoop en coaching-aanvragen — zonder te leven van referrals
    of te hopen dat de volgende klant vanzelf komt.
  en: >
    Most coaches already have the expertise. What's missing is a
    system that turns that expertise into predictable client conversations,
    product sales and coaching enquiries — without relying on referrals
    or hoping the next client shows up on their own.
  es: >
    La mayoría de coaches ya tienen la experiencia. Lo que falta es un
    sistema que convierta esa experiencia en conversaciones predecibles
    con clientes, ventas de productos y solicitudes de coaching — sin
    depender de referidos o esperar que el próximo cliente aparezca solo.
