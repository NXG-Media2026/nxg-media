citableDefinition:
  nl: >
    De Coach Accelerator is een compleet groeisysteem voor coaches
    en experts — van een snelle, AI-vindbare website tot storytelling,
    mini-producten, emailflows en ads. Alles werkt samen als één
    machine die zichtbaarheid, leads en klanten oplevert. AI-vindbaarheid
    is geen extra, het is het fundament.
  en: >
    The Coach Accelerator is a complete growth system for coaches
    and experts — from a fast, AI-visible website to storytelling,
    micro-products, email flows and ads. Everything works together as
    one machine that delivers visibility, leads and clients. AI visibility
    isn't an add-on, it's the foundation.
hubIntro:
  nl: >
    Veel coaches en experts hebben de kennis al binnen. Wat ontbreekt
    is een systeem dat die kennis omzet in voorspelbare leads,
    productverkoop en coaching-aanvragen — gebouwd op een snelle website
    die niet alleen converteert, maar ook vindbaar is in ChatGPT,
    Gemini en Perplexity. Hier laat ik zien hoe ik dat bouw.
  en: >
    Many coaches and experts already have the expertise. What is often
    missing is a system that turns that expertise into predictable leads,
    product sales and coaching enquiries — built on a fast website that
    not only converts, but is also visible in ChatGPT, Gemini and
    Perplexity. This hub shows how I build that system.
