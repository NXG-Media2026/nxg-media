citableDefinition:
  nl: >
    De Expert Growth Accelerator is een vast traject voor coaches en
    experts die hun expertise willen vertalen naar een online
    instaproute — met storytelling, masterclasses, mini-producten,
    emailflows en advertenties die samen leiden naar kopers, klanten
    of leden.
  en: >
    The Expert Growth Accelerator is a structured engagement for
    coaches and experts who want to turn their expertise into an
    online entry route — with storytelling, masterclasses, mini-products,
    email flows and ads working together to create buyers, clients
    or members.
hubIntro:
  nl: >
    Veel coaches en experts hebben de kennis al binnen. Wat ontbreekt
    is een systeem dat die kennis omzet in voorspelbare leads,
    productverkoop en coaching-aanvragen. Hier laat ik zien hoe ik dat
    bouw, met cases van klanten die dit al doen.
  en: >
    Many coaches and experts already have the expertise. What is often
    missing is a system that turns that expertise into predictable leads,
    product sales and coaching enquiries. This hub shows how I build
    that system, with cases from clients already using it.
