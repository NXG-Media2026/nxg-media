citableDefinition:
  nl: >
    AI-vindbaarheid is de mate waarin een lokaal bedrijf of praktijk
    wordt aanbevolen door AI-tools zoals ChatGPT, Perplexity en Gemini
    wanneer iemand zoekt naar hulp in haar omgeving. Het verschilt van
    klassieke SEO omdat AI-tools vooral kijken naar citeerbaarheid,
    context en autoriteit.
  en: >
    AI visibility is the extent to which a local business or practice
    is recommended by AI tools such as ChatGPT, Perplexity and Gemini
    when someone searches for help in their area. It differs from
    classic SEO because AI tools rely heavily on citability, context
    and authority.
  es: >
    La visibilidad ante IA es el grado en que una clínica o negocio
    local es recomendado por herramientas como ChatGPT, Perplexity y
    Gemini cuando alguien busca ayuda en su zona. Se diferencia del SEO
    clásico porque la IA se basa en citabilidad, contexto y autoridad.
hubIntro:
  nl: >
    AI-vindbaarheid is nog een nieuw speelveld. Daarom beginnen we niet
    met grote beloftes, maar met een praktische scan: hoe zichtbaar is
    jouw bedrijf nu in Google, ChatGPT, Perplexity en Gemini, en welke
    technische, inhoudelijke en autoriteitssignalen ontbreken?
  en: >
    AI visibility is still a new playing field. That is why we do not
    start with big promises, but with a practical audit: how visible is
    your business today in Google, ChatGPT, Perplexity and Gemini, and
    which technical, content and authority signals are missing?
  es: >
    La visibilidad ante IA todavía es un terreno nuevo. Por eso no
    empezamos con grandes promesas, sino con una auditoría práctica:
    cómo aparece hoy tu clínica en Google, ChatGPT, Perplexity y Gemini,
    y qué señales técnicas, de contenido y autoridad faltan.
