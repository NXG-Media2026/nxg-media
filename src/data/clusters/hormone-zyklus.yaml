# === LOCALE OVERRIDES ===
locales:
  en:
    hubSlug: hormones-and-cycle
    title: "Hormones & Cycle"
    shortTitle: "Hormones"
    citableDefinition: >
      The female hormonal cycle influences energy, sleep, mood, training,
      nutrition, histamine tolerance and stress resilience. Understanding
      your cycle helps you adapt daily life and training with more clarity,
      instead of treating your body as unpredictable.
    hubIntro: >
      Many women do a lot right and still do not feel right. This cluster
      helps you recognize patterns across cycle, hormones, training,
      nutrition and recovery — without turning health into another rulebook.
    hubFaq:
      - question: "What does hormone balance actually mean?"
        answer: "Hormone balance means the key female hormones — estrogen, progesterone and cortisol — are in a ratio that supports energy, sleep, cycle regularity and recovery."
      - question: "Why does my body feel different every week?"
        answer: "The female cycle changes hormone levels over roughly four weeks. Energy, load tolerance and mood naturally fluctuate — that is physiology, not a deficit."
      - question: "What is cycle-aware training?"
        answer: "Cycle-aware training adapts intensity and recovery to the hormonal phases of the menstrual cycle. It is not about training less, but about timing effort more intelligently."
      - question: "Why does generic health advice often fail women?"
        answer: "Most nutrition and training recommendations are based on studies with male subjects. The female hormonal cycle changes metabolism, energy needs and recovery in every phase."
      - question: "When is a masterclass enough and when is coaching better?"
        answer: "The masterclass teaches the fundamentals of hormones, histamine and cycle. Coaching is recommended when you need individual guidance for complex situations such as perimenopause, RED-S or multiple concurrent symptoms."
      - question: "Is this medical treatment?"
        answer: "No. doc.veri provides evidence-based knowledge and health guidance but does not replace medical diagnostics or therapy. For specific concerns, please consult your physician."

