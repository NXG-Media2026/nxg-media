# === HUB-LEVEL CURATED FAQ ===
hubFaq:
  - question: "Was bedeutet Hormonbalance eigentlich?"
    answer: "Hormonbalance bedeutet, dass die wichtigsten weiblichen Hormone — Oestrogen, Progesteron und Cortisol — in einem Verhaeltnis zueinander stehen, das Energie, Schlaf, Zyklus und Regeneration unterstuetzt."
  - question: "Warum fuehlt sich mein Koerper jede Woche anders an?"
    answer: "Der weibliche Zyklus veraendert Hormonlevel ueber etwa vier Wochen. Energie, Belastbarkeit und Stimmung schwanken deshalb natuerlich — das ist kein Defizit, sondern Physiologie."
  - question: "Was ist zyklusbewusstes Training?"
    answer: "Zyklusbewusstes Training passt Intensitaet und Erholung an die hormonellen Phasen des Menstruationszyklus an. Es geht nicht darum weniger zu trainieren, sondern Belastung besser zu timen."
  - question: "Warum scheitert generischer Gesundheitsrat oft bei Frauen?"
    answer: "Die meisten Ernaehrungs- und Trainingsempfehlungen basieren auf Studien mit maennlichen Probanden. Der weibliche Hormonzyklus veraendert Stoffwechsel, Energiebedarf und Regeneration in jeder Phase anders."
  - question: "Wann reicht eine Masterclass und wann brauche ich Coaching?"
    answer: "Die Masterclass vermittelt das Grundwissen ueber Hormone, Histamin und Zyklus. Coaching ist sinnvoll, wenn du individuelle Begleitung fuer komplexe Situationen brauchst — etwa Perimenopause, RED-S oder mehrere gleichzeitige Beschwerden."
  - question: "Ist das eine aerztliche Behandlung?"
    answer: "Nein. doc.veri bietet evidenzbasiertes Wissen und gesundheitliche Begleitung, ersetzt aber keine aerztliche Diagnostik oder Therapie. Bei konkreten Beschwerden solltest du deine Aerztin konsultieren."

