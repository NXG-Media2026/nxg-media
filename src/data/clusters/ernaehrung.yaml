# === HUB-LEVEL CURATED FAQ ===
hubFaq:
  - question: "Ist gesunde Ernaehrung fuer jede Frau gleich?"
    answer: "Nein, die optimale Ernaehrung haengt von Zyklus, Lebensphase, Belastung und individueller Vertraeglichkeit ab. Generische Diaetplaene beruecksichtigen diese Faktoren selten."
  - question: "Warum kann ein gesunder Smoothie trotzdem nicht zu mir passen?"
    answer: "Zutaten wie Spinat, Banane oder Avocado koennen bei Histaminintoleranz oder Fructose-Empfindlichkeit Beschwerden ausloesen. Was gesund klingt, ist nicht fuer jede Frau gleich vertraeglich."
  - question: "Ist glutenfrei immer besser?"
    answer: "Glutenfrei ist nicht automatisch gesuender. Es kann sinnvoll sein bei nachgewiesener Unvertraeglichkeit oder Zoeliakie, aber nicht jede Frau profitiert davon."
  - question: "Wie beeinflusst Ernaehrung Hormone und Training?"
    answer: "Ernaehrung liefert die Bausteine fuer Hormonproduktion und die Energie fuer Training und Regeneration. Zu wenig Energie, zu wenig Protein oder fehlende Mikro-Naehrstoffe koennen das Hormonsystem beeintraechtigen."
  - question: "Wie vermeide ich, dass Essen zum naechsten Regelwerk wird?"
    answer: "Der Fokus bei doc.veri liegt auf alltagstauglicher, flexibler Ernaehrung. Kein Kalorienzaehlen, keine starren Plaene — sondern ein Grundverstaendnis fuer das, was dein Koerper in welcher Phase braucht."

