# === LOCALE OVERRIDES ===
locales:
  en:
    hubSlug: nutrition
    title: "Nutrition"
    shortTitle: "Nutrition"
    citableDefinition: >
      Nutrition influences energy, digestion, blood sugar, training,
      hormones and wellbeing. For women, nutrition works best when it
      respects cycle, stress, training load and real life instead of
      becoming a rigid rulebook.
    hubIntro: >
      Healthy eating should make life bigger, not smaller. This cluster
      focuses on practical nutrition that fits your body and your life,
      without turning food into a spreadsheet.
    hubFaq:
      - question: "Is healthy eating the same for every woman?"
        answer: "No, optimal nutrition depends on cycle, life phase, training load and individual tolerance. Generic diet plans rarely account for these factors."
      - question: "Why can a healthy smoothie still not work for me?"
        answer: "Ingredients like spinach, banana or avocado can trigger symptoms in women with histamine intolerance or fructose sensitivity. What sounds healthy is not equally tolerable for every woman."
      - question: "Is gluten-free always better?"
        answer: "Going gluten-free is not automatically healthier. It can make sense with confirmed intolerance or celiac disease, but not every woman benefits from it."
      - question: "How does nutrition affect hormones and training?"
        answer: "Nutrition provides the building blocks for hormone production and the energy for training and recovery. Too little energy, too little protein or missing micronutrients can impair the hormonal system."
      - question: "How do I avoid turning food into another rulebook?"
        answer: "The focus at doc.veri is on practical, flexible nutrition. No calorie counting, no rigid plans — just a basic understanding of what your body needs in each phase."

