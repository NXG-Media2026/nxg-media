citableDefinition: >
  Die Perimenopause ist die hormonelle Uebergangsphase vor der Menopause.
  Sie kann Jahre dauern und sich durch veraenderten Schlaf, Zyklus,
  Stimmung, Regeneration, Belastbarkeit und Koerpergefuehl zeigen — auch
  wenn die Periode noch regelmaessig ist.

hubIntro: >
  Perimenopause beginnt oft nicht mit einem klaren Moment, sondern mit
  kleinen Veraenderungen: schlechter schlafen, anders auf Stress reagieren,
  weniger gut regenerieren oder den eigenen Koerper nicht mehr richtig
  einordnen koennen.

