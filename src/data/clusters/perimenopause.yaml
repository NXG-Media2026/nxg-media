# === LOCALE OVERRIDES ===
locales:
  en:
    hubSlug: perimenopause
    title: "Perimenopause"
    shortTitle: "Perimenopause"
    citableDefinition: >
      Perimenopause is the hormonal transition phase before menopause.
      It can last for years and may show up through changes in sleep,
      cycle, mood, recovery, stress tolerance and body awareness — even
      while periods are still regular.
    hubIntro: >
      Perimenopause often does not start with one obvious moment. It often
      begins with subtle changes: sleep feels different, recovery takes
      longer, stress hits harder, and your body no longer feels familiar.
    hubFaq:
      - question: "Can perimenopause start in the late 30s?"
        answer: "Perimenopause can begin as early as the mid to late 30s. Many women notice the first changes 5 to 10 years before their last period, often without recognizing them."
      - question: "Can I be in perimenopause if my cycle is still regular?"
        answer: "Yes, a regular cycle does not rule out perimenopause. Hormonal changes often begin before the cycle visibly changes — sleep, mood and recovery are frequently the first signals."
      - question: "Why do sleep, mood and recovery change?"
        answer: "Declining progesterone and fluctuating estrogen levels directly affect sleep quality, stress resilience and recovery capacity. These changes are hormonal and not a sign of weakness."
      - question: "What is the difference between PMS, stress and perimenopause?"
        answer: "PMS occurs cyclically and ends with menstruation. Chronic stress affects the entire cycle. Perimenopause shows up through increasing irregularity and new symptoms that extend beyond individual cycle phases."
      - question: "Does the Perimenopause Protocol replace medical care?"
        answer: "No, the Protocol provides evidence-based knowledge for self-help. It does not replace medical diagnostics or therapy. For severe symptoms, please consult your physician."
      - question: "When should I consider coaching?"
        answer: "Coaching is recommended when you need individual guidance — for example with multiple concurrent symptoms, uncertain diagnostics, or the desire for a personal plan for nutrition, training and lifestyle."

