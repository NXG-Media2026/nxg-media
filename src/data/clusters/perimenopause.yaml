# === HUB-LEVEL CURATED FAQ ===
hubFaq:
  - question: "Kann die Perimenopause schon Ende 30 beginnen?"
    answer: "Die Perimenopause kann bereits ab Mitte bis Ende 30 beginnen. Viele Frauen bemerken die ersten Veraenderungen 5 bis 10 Jahre vor der letzten Menstruation, oft ohne sie einzuordnen."
  - question: "Kann ich in der Perimenopause sein, wenn mein Zyklus noch regelmaessig ist?"
    answer: "Ja, ein regelmaessiger Zyklus schliesst Perimenopause nicht aus. Hormonelle Veraenderungen beginnen oft, bevor sich der Zyklus sichtbar veraendert — Schlaf, Stimmung und Regeneration sind haeufig die ersten Signale."
  - question: "Warum veraendern sich Schlaf, Stimmung und Regeneration?"
    answer: "Sinkende Progesteron- und schwankende Oestrogenspiegel beeinflussen Schlafqualitaet, Stressresistenz und Regenerationsfaehigkeit direkt. Diese Veraenderungen sind hormonell bedingt und kein Zeichen von Schwaeche."
  - question: "Was ist der Unterschied zwischen PMS, Stress und Perimenopause?"
    answer: "PMS tritt zyklusabhaengig auf und endet mit der Menstruation. Chronischer Stress betrifft den gesamten Zyklus. Perimenopause zeigt sich durch zunehmende Unregelmaessigkeit und neue Symptome, die ueber einzelne Zyklusphasen hinausgehen."
  - question: "Ersetzt das Perimenopause Protocol eine aerztliche Behandlung?"
    answer: "Nein, das Protocol ist evidenzbasiertes Wissen zur Selbsthilfe. Es ersetzt keine aerztliche Diagnostik oder Therapie. Bei starken Beschwerden solltest du deine Aerztin konsultieren."
  - question: "Wann sollte ich Coaching in Betracht ziehen?"
    answer: "Coaching ist sinnvoll, wenn du individuelle Begleitung brauchst — etwa bei mehreren gleichzeitigen Symptomen, unsicherer Diagnostik oder dem Wunsch nach einem persoenlichen Plan fuer Ernaehrung, Training und Lebensstil."

