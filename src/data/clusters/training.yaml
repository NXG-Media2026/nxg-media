# === HUB-LEVEL CURATED FAQ ===
hubFaq:
  - question: "Was ist zyklusbewusstes Training?"
    answer: "Zyklusbewusstes Training passt Intensitaet und Erholung an die hormonellen Phasen des Menstruationszyklus an. Das Ziel ist nicht weniger Training, sondern bessere Abstimmung von Belastung und Regeneration."
  - question: "Bedeutet zyklusbewusstes Training weniger zu trainieren?"
    answer: "Nein. Zyklusbewusstes Training verschiebt Schwerpunkte: Intensitaet in Phasen, in denen dein Koerper sie besser verarbeitet, und Erholung, wenn Regeneration laenger dauert."
  - question: "Warum fuehlen sich manche Wochen schwerer an als andere?"
    answer: "Schwankende Oestrogen- und Progesteronspiegel beeinflussen Energielevel, Muskelkraft, Koordination und Schmerzempfinden. In der Lutealphase und um die Menstruation herum ist Belastbarkeit oft reduziert."
  - question: "Wie passe ich mein Training in der Lutealphase an?"
    answer: "In der Lutealphase sind moderate Intensitaet, kuerzere Sessions und laengere Erholungszeiten oft sinnvoller als Maximalbelastung. Krafttraining und Ausdauer im Grundlagenbereich funktionieren in dieser Phase gut."
  - question: "Was hat Regeneration mit Hormonen zu tun?"
    answer: "Progesteron und Cortisol beeinflussen Schlafqualitaet und Regenerationsgeschwindigkeit direkt. In Phasen mit niedrigem Progesteron oder hohem Cortisol dauert Erholung laenger und das Verletzungsrisiko kann steigen."

