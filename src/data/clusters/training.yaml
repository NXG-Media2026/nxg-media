# === LOCALE OVERRIDES ===
locales:
  en:
    hubSlug: cycle-aware-training
    title: "Training & Cycle"
    shortTitle: "Training"
    citableDefinition: >
      Cycle-aware training recognizes that energy, load tolerance,
      recovery and stress resilience can shift across the female cycle.
      It is not about training less, but about timing effort and recovery
      more intelligently.
    hubIntro: >
      If some training weeks suddenly feel harder, it does not automatically
      mean you lack discipline. Training becomes easier to understand when
      your cycle becomes a data point instead of something you ignore.
    hubFaq:
      - question: "What is cycle-aware training?"
        answer: "Cycle-aware training adapts intensity and recovery to the hormonal phases of the menstrual cycle. The goal is not less training but better alignment of effort and recovery."
      - question: "Does cycle-aware training mean doing less?"
        answer: "No. Cycle-aware training shifts emphasis: intensity in phases when your body can process it better, and recovery when regeneration takes longer."
      - question: "Why do some weeks feel harder than others?"
        answer: "Fluctuating estrogen and progesterone levels affect energy levels, muscle strength, coordination and pain perception. During the luteal phase and around menstruation, load tolerance is often reduced."
      - question: "How should I adapt training in the luteal phase?"
        answer: "In the luteal phase, moderate intensity, shorter sessions and longer recovery times are often more effective than maximum effort. Strength training and base-level endurance work well in this phase."
      - question: "What does recovery have to do with hormones?"
        answer: "Progesterone and cortisol directly affect sleep quality and recovery speed. In phases with low progesterone or high cortisol, recovery takes longer and injury risk may increase."

