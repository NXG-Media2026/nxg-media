term: Histamine
slug: histamine
cluster: histamin
locale: en
translationKey: histamin

definition: >-
  Histamine is an endogenous chemical messenger that regulates immune responses,
  digestion, and the sleep-wake cycle. In women, estrogen influences histamine
  breakdown, which is why symptoms can intensify in a cycle-dependent manner.

longDescription: >-
  Histamine is both produced by the body and absorbed through food. It plays a
  central role in allergic reactions, stomach acid production, and signal
  transmission in the nervous system. The enzyme diaminoxidase (DAO) breaks down
  histamine in the gut. In women, estrogen can reduce DAO activity, which explains
  why histamine symptoms increase during certain cycle phases, in perimenopause,
  or under chronic stress. Common symptoms include skin flushing, headaches,
  digestive issues, and sleep disturbances.

relatedTerms:
