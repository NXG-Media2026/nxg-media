term: "Östrogen"
slug: oestrogen
cluster: histamin
secondaryClusters:
  - perimenopause
  - hormone-zyklus

definition: >-
  Oestrogen ist eine Gruppe weiblicher Sexualhormone, die Zyklus,
  Knochengesundheit und kognitive Funktion regulieren. Oestrogen beeinflusst
  auch die DAO-Aktivitaet und damit den Histaminabbau, was zyklusabhaengige
  Symptome erklaeren kann.

longDescription: >-
  Oestrogene werden vor allem in den Eierstoecken produziert und steuern
  zahlreiche Koerperfunktionen: von der Gebärmutterschleimhaut ueber die
  Knochengesundheit bis zur Stimmung und kognitiven Leistung. Im Kontext
  von Histamin ist Oestrogen besonders relevant, weil es die Produktion
  des Histamin-abbauenden Enzyms DAO hemmen kann. Das erklaert, warum viele
  Frauen in der oestrogendominanten Follikelphase oder bei hohen
  Oestrogen-Schwankungen in der Perimenopause vermehrt Histamin-Symptome
  erleben. In der Perimenopause sinkt der Oestrogenspiegel insgesamt,
  allerdings mit starken Schwankungen, die den Histaminhaushalt zusaetzlich
  destabilisieren koennen.

relatedTerms:
  - histamin
  - dao
  - perimenopause
  - menstruationszyklus

seo:
  title: "Östrogen — Einfluss auf Histamin und Zyklus"
  description: "Oestrogen reguliert den weiblichen Zyklus und beeinflusst den Histaminabbau ueber das Enzym DAO. Erfahre mehr ueber die Zusammenhaenge."
