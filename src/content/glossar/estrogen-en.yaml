term: "Estrogen"
slug: estrogen
locale: en
translationKey: "oestrogen"
cluster: histamin
secondaryClusters:
  - perimenopause

definition: >-
  Estrogen is a group of female sex hormones that regulate the menstrual cycle,
  bone health, and cognitive function. Estrogen also influences DAO activity
  and thus histamine breakdown, which can explain cycle-dependent symptoms.

longDescription: >-
  Estrogens are primarily produced in the ovaries and control numerous body
  functions: from the uterine lining to bone health to mood and cognitive
  performance. In the context of histamine, estrogen is particularly relevant
  because it can inhibit the production of the histamine-degrading enzyme DAO.
  This explains why many women experience increased histamine symptoms during
  the estrogen-dominant follicular phase or during strong estrogen fluctuations
  in perimenopause. During perimenopause, overall estrogen levels decline,
  but with significant fluctuations that can further destabilize histamine
  balance.

