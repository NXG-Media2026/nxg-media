term: Histamin
slug: histamin
cluster: histamin
translationKey: histamin

definition: >-
  Histamin ist ein koerpereigener Botenstoff, der Immunreaktionen, Verdauung und
  den Schlaf-Wach-Rhythmus steuert. Bei Frauen beeinflusst Oestrogen den
  Histaminabbau, weshalb sich Symptome zyklusabhaengig verstaerken koennen.

longDescription: >-
  Histamin wird im Koerper sowohl selbst produziert als auch ueber die Nahrung
  aufgenommen. Es spielt eine zentrale Rolle bei allergischen Reaktionen,
  der Magensaeureproduktion und der Signalweiterleitung im Nervensystem.
  Das Enzym Diaminoxidase (DAO) baut Histamin im Darm ab. Bei Frauen kann
  Oestrogen die DAO-Aktivitaet senken, was erklaert, warum Histamin-Symptome
  in bestimmten Zyklusphasen, in der Perimenopause oder unter chronischem
  Stress zunehmen. Typische Beschwerden sind Hautroetungen, Kopfschmerzen,
  Verdauungsprobleme und Schlafstörungen.

relatedTerms:
