term: DAO (Diaminoxidase)
slug: dao
cluster: histamin
translationKey: dao

definition: >-
  Diaminoxidase (DAO) ist das Enzym, das Histamin im Darm abbaut. Eine
  verminderte DAO-Aktivitaet fuehrt dazu, dass Histamin sich im Koerper
  ansammelt und Symptome wie Kopfschmerzen, Hautreaktionen oder
  Verdauungsbeschwerden ausloest.

longDescription: >-
  DAO wird hauptsaechlich in der Darmschleimhaut gebildet und ist der wichtigste
  Abbauweg fuer Histamin aus der Nahrung. Verschiedene Faktoren koennen die
  DAO-Produktion beeintraechtigen: Alkohol, bestimmte Medikamente, chronische
  Darmentzuendungen und hormonelle Schwankungen. Bei Frauen kann ein hoher
  Oestrogenspiegel die DAO-Aktivitaet senken, was erklaert, warum
  Histamin-Beschwerden oft zyklusabhaengig auftreten. Die DAO-Aktivitaet laesst
  sich im Blut messen und ist ein wichtiger Marker bei der Abklaerung einer
  Histaminintoleranz.

relatedTerms:
  - histamin
  - oestrogen

